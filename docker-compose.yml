version: '3'

services:
  ###> doctrine/doctrine-bundle ###
  db:
    image: mysql:latest
    container_name: db_symfony_orteky
    restart: always
    command: mysqld --sql_mode="STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - 3309:3306

    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    networks:
      - dev

  phpmyadmin:
    image: phpmyadmin
    container_name: php_my_admin
    restart: always
    depends_on:
      - db
    ports:
      - 8080:80
    environment:
      PMA_HOST : db
    networks:
      - dev

networks:
  dev:

volumes:
  db-data: